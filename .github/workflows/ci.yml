name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  schedule:
    # Prime the caches every Monday
    - cron: 0 1 * * MON

env:
  DUNE_PROFILE: release
  OCAMLRUNPARAM: b

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build and test

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          # - windows-latest
        ocaml-compiler:
          - 4.14.2
          - 5.4.0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup OCaml and dependencies
        uses: ml-in-barcelona/gh-ci-action@v1.2.0
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          with-doc: true
          with-dev-setup: true

      - name: Load dune cache
        uses: ml-in-barcelona/gh-ci-action/dune-cache/load@v1.2.0

      - name: Build
        run: make build

      - name: Check formatting
        run: make format-check

      - name: Run tests
        run: make test

      - name: Generate docs
        if: github.ref == 'refs/heads/main'
        run: make documentation

      - name: Publish docs
        uses: crazy-max/ghaction-github-pages@v1
        if: github.ref == 'refs/heads/main'
        with:
          target_branch: gh-pages
          build_dir: _build/default/_doc_new/html
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Save dune cache
        uses: ml-in-barcelona/gh-ci-action/dune-cache/save@v1.2.0

      - name: Install dune-release
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-latest' && matrix.ocaml-compiler == '5.4.0'
        run: opam install dune-release -y

      - name: Release
        uses: davesnx/dune-release-action@v0.4.0
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-latest' && matrix.ocaml-compiler == '5.4.0'
        with:
          packages: 'quickjs'
          changelog: './CHANGES.md'
          github-token: ${{ secrets.GH_TOKEN }}
          include-submodules: true
